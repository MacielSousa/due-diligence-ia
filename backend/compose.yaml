# Ambiente completo em containers (Laravel Sail).
# Subir:   ./vendor/bin/sail up -d
# Parar:   ./vendor/bin/sail down          (os dados ficam nos volumes)
#
#   web (Vue :5180) ─► laravel.test (API :8000) ─► mysql (dados)
#                            └─ fila redis ─► queue (worker) ─► ollama (Llama, GPU)
services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
    # Worker da fila (Redis): executa a análise dos documentos por IA em background.
    queue:
        image: 'sail-8.4/app'
        command: ['php', '/var/www/html/artisan', 'queue:work', 'redis', '--tries=1', '--timeout=1900']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
        restart: unless-stopped
    # Frontend Vue 3 servido pelo Vite; /api é repassado para o Laravel.
    web:
        image: 'node:22-alpine'
        user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
        working_dir: /app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5180 --strictPort"
        environment:
            API_PROXY_TARGET: 'http://laravel.test'
        ports:
            - '${WEB_PORT:-5180}:5180'
        volumes:
            - '../frontend:/app'
        networks:
            - sail
        restart: unless-stopped
        depends_on:
            - laravel.test
    # LLM local (Llama 3.2 3B via Ollama). Modelo: ../ia/criar-modelo.sh backend-ollama-1
    ollama:
        image: 'ollama/ollama:0.6.8'
        ports:
            - '${FORWARD_OLLAMA_PORT:-11434}:11434'
        volumes:
            - 'sail-ollama:/root/.ollama'
        networks:
            - sail
        restart: unless-stopped
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3307}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            retries: 10
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6380}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    # Reaproveita o volume do Ollama do projeto antigo: o llama3.2:3b e o due-diligence já estão nele.
    sail-ollama:
        external: true
        name: api_sail-ollama
