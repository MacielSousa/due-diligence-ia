# Override opcional: dá acesso à GPU NVIDIA ao container do Ollama.
# Requer driver NVIDIA com suporte a WSL e o NVIDIA Container Toolkit (scripts/habilitar-gpu-wsl.sh).
# Ativar no apps/api/.env:  COMPOSE_FILE=compose.yaml:compose.gpu.yaml
services:
    ollama:
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
